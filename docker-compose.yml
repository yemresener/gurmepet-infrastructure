services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - storage_data:/var/www/storage/app/public
      - public_assets:/var/www/public_shared
      - ./certbot/www:/var/www/certbot
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      default:
        aliases:
          - gurmepet.com.tr

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  backend:
    image: ghcr.io/ahmetemirsener/gurmepet-backend:latest
    volumes:
      - storage_data:/var/www/storage/app/public
      - public_assets:/var/www/public_shared
      - ./backend.env:/var/www/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  queue-worker:
    image: ghcr.io/ahmetemirsener/gurmepet-backend:latest
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./backend.env:/var/www/.env
    depends_on:
      - mysql
      - backend
      - redis
    restart: unless-stopped

  scheduler:
    image: ghcr.io/ahmetemirsener/gurmepet-backend:latest
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - ./backend.env:/var/www/.env
    depends_on:
      - mysql
      - backend
      - redis
    restart: unless-stopped

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data 

  frontend:
    image: ghcr.io/yemresener/gurmepet-frontend:latest
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backup:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: >
      sh -c "while true; do
      mysqldump -h mysql -u root -p$$MYSQL_ROOT_PASSWORD ecommerce | gzip > /backups/backup_$$(date +%Y%m%d_%H%M%S).sql.gz;
      find /backups -name '*.sql.gz' -mtime +7 -delete;
      sleep 86400;
      done"
    volumes:
      - ./backups:/backups
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  storage_data:
  mysql_data:
  redis_data:
  public_assets: