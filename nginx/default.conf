server {
    listen 80;
    server_name gurmepet.com.tr www.gurmepet.com.tr; # www eklemek her zaman iyidir
    client_max_body_size 20M;

    # Güvenlik ve Performans (Mükemmel kısımların)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Certbot'un doğrulama yapacağı yer
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Backend API, Sanctum ve varsa Admin rotaları
    location /api/ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param QUERY_STRING $query_string;
        include fastcgi_params;
    }

    # Resimler ve Dosyalar (DÜZELTİLDİ)
    location /storage/ {
        alias /var/www/storage/app/public/;
        try_files $uri $uri/ =404;
        expires 30d;
        access_log off;
    }

    # Angular Frontend SSR (Eksik Header EKLENDİ)
    location / {
        proxy_pass http://frontend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name admin.gurmepet.com.tr;
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location ~* \.(css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|webp)$ {
        root /var/www/public_shared;
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location /storage/ {
        alias /var/www/storage/app/public/;
        try_files $uri $uri/ =404;
        expires 30d;
        access_log off;
    }

    location / {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param QUERY_STRING $query_string;
        include fastcgi_params;
    }
}